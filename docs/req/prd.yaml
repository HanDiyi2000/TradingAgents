product: TradingAgents
status: draft
stakeholders:
- Stock analysis users
- CS5351 project team
goals:
- Include options-market evidence in stock research and risk evaluation.
in_scope:
- 'FEAT-01: default-selectable Options Analyst, independent report, downstream delivery, export and unavailable-data
  handling.'
- 'FEAT-02: end a stalled bull/bear research debate and hand its history to the Research Manager.'
- 'FEAT-03: introduce the company to readers of the consolidated stock analysis report.'
- 'FEAT-04: warn once when cumulative token usage exceeds the threshold for one CLI or web analysis.'
- 'FEAT-05: trace bull and bear arguments to numbered paragraphs in the analyst reports supplied to the debate.'
- 'FEAT-06: run a local, single-user stock analysis from configuration through live output and report download in one browser page.'
out_of_scope:
- 'FEAT-01: option contract recommendations, option strategy construction and order execution.'
features:
  - id: FEAT-01
    name: Options Analyst
    requirement_ids:
      - FR-OPT-01
      - FR-OPT-02
      - FR-OPT-03
      - FR-OPT-04
      - FR-OPT-05
      - INV-OPT-01
  - id: FEAT-02
    name: Research debate early stop
    requirement_ids: [FR-DEB-01]
  - id: FEAT-03
    name: Company background in the final report
    requirement_ids: [FR-RPT-01]
  - id: FEAT-04
    name: Per-run token usage warning
    requirement_ids: [FR-TOK-01]
  - id: FEAT-05
    name: Paragraph citations in the research debate
    requirement_ids: [FR-CIT-01]
  - id: FEAT-06
    name: Local web interface for stock analysis
    requirement_ids: [FR-WEB-01, FR-WEB-02, FR-WEB-03]
cross_cutting_requirements: [QA-WEB-01, PERF-WEB-01, COST-WEB-01, GOV-DEP-01, SEC-OPT-01]
provider_decision: See ADR 001 and FR-OPT-05 for current-chain provenance and the unavailable-data fallback.
