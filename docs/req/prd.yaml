      - FR-OPT-03
      - FR-OPT-04
      - FR-OPT-05
      - INV-OPT-01
  - id: FEAT-02
    name: Research debate early stop
    requirement_ids: [FR-DEB-01]
open_questions:
- Select a provider after checking timestamp provenance and historical coverage.
- Choose report indicators supported by the selected source.
