requirements:
- id: FR-OPT-01
  type: functional
  priority: Must
  statement: Select Options Analyst by default alongside the four existing analysts for stock analysis. Honor explicit
    selections, including saved selections that omit options.
  source: Team lead, Options Analyst discussion and confirmation, 2026-11-22. Baseline 909c6c4, src/cli/models.py
    and src/tradingagents/graph/trading_graph.py.
  tradeoff: Default coverage adds a data lookup and may add a model call. Explicit selection controls this cost.
  fit_criterion:
    metric: Selection cases with incorrect active analysts or unexpected options calls
    threshold: 0
    verification: OPT-T1 in docs/code-governance/verification-constraints.md
- id: FR-OPT-02
  type: functional
  priority: Must
  statement: When usable options evidence exists, produce a separate report for the selected stock and analysis
    date. Ground its interpretation in the option chain. Market Analyst retains responsibility for technical analysis
    of the underlying stock.
  source: Team lead, Options Analyst discussion and confirmation, 2026-11-22. Baseline 909c6c4, src/tradingagents/agents/analysts/market_analyst.py.
  tradeoff: A separate report preserves evidence provenance and adds a report to the workflow.
  fit_criterion:
    metric: Fixture runs yielding one identifiable options report grounded in the supplied option-chain evidence
    threshold: 1
    verification: OPT-T2 in docs/code-governance/verification-constraints.md
- id: FR-OPT-03
  type: functional
  priority: Must
  statement: Deliver the options report to the bull and bear researchers and to each of the three risk debaters.
    Carry their reasoning forward through the existing research plan, trader proposal and final decision interfaces.
  source: Team lead, Options Analyst discussion and confirmation, 2026-11-22. Baseline 909c6c4, src/tradingagents/agents/{researchers,risk_mgmt,managers,trader}/.
  tradeoff: Direct delivery gives both debates access to the evidence at the cost of extra context.
  fit_criterion:
    metric: Distinct direct recipients whose model input contains the options report marker
    threshold: 5
    verification: OPT-T3 in docs/code-governance/verification-constraints.md
- id: FR-OPT-04
  type: functional
  priority: Must
  statement: Show the selected analyst and its report in the CLI. Include the report in the run state and saved
    log, the individual Markdown report and the consolidated reports produced by the existing CLI and Python export
    paths.
  source: Team lead, Options Analyst discussion and confirmation, 2026-11-22. Baseline 909c6c4, src/cli/display.py,
    src/tradingagents/graph/trading_graph.py and src/tradingagents/reporting.py.
  tradeoff: One additional section increases report size and makes the evidence inspectable.
  fit_criterion:
    metric: Required display, state, log or export locations missing the fixture report
    threshold: 0
    verification: OPT-T4 in docs/code-governance/verification-constraints.md
- id: FR-OPT-05
  type: functional
  priority: Must
  statement: When selected and no usable options data exists for the analysis date, publish an explicit data-unavailable
    report, deliver and save it through the usual paths, and continue the stock analysis to a final decision.
  source: 'Team lead, Options Analyst discussion and confirmation, 2026-11-22. '
  tradeoff: A run can finish with less evidence. The status makes that limitation visible.
  fit_criterion:
    metric: Unavailable-data cases missing the notice, the delivery, the saved report or the final decision
    threshold: 0
    verification: OPT-T5 in docs/code-governance/verification-constraints.md
- id: INV-OPT-01
  type: invariant
  priority: Must
  statement: Only admit options evidence attributable to the requested stock and available as of the analysis cutoff.
    Exclude later snapshots and records whose identity or availability time cannot be verified. If no eligible evidence
    remains, apply FR-OPT-05.
  source: Team lead, Options Analyst discussion and confirmation, 2026-11-22. The rejection of unverifiable records
    operationalizes the approved historical-data rule.
  tradeoff: Historical coverage decreases when the provider cannot establish what was known at the time.
  fit_criterion:
    metric: Ineligible evidence records passed to the analyst in cutoff and identity fixtures
    threshold: 0
    verification: OPT-T6 in docs/code-governance/verification-constraints.md
- id: FR-DEB-01
  type: functional
  priority: Must
  statement: >
    Let both researchers speak once in the opening round. From round two onward, evaluate progress
    only after both have spoken. End the debate early when neither side introduces evidence new to
    this debate nor gives a first substantive reply to a previously unanswered opposing argument.
    Record the reason for early termination and pass the complete debate history to the Research Manager.
    The configured maximum number of rounds remains binding.
  source: Team lead, FEAT-02 discussion on 2026-11-22. Baseline routing in src/tradingagents/graph/conditional_logic.py.
  tradeoff: Ending repeated exchanges saves debate turns. Waiting for a full round gives both sides a chance to contribute.
  fit_criterion:
    metric: Scripted cases with an incorrect next speaker, stop round, termination reason or manager history
    threshold: 0
    verification: DEB-T1 through DEB-T5 in docs/code-governance/verification-constraints.md
- id: FR-RPT-01
  type: functional
  priority: Must
  statement: >
    Each consolidated stock report shall display one Company Background section after its header and
    before analyst reports, regardless of the analysts selected. Show the available company name,
    industry and a one- or two-sentence business description from the source. Omit missing fields.
    If no eligible fields are available, display an unavailable notice and complete the export.
    Apply the existing historical-date policy and show the same information in Markdown and requested HTML.
  source: Team lead, FEAT-03 discussion and approval on 2026-11-22. Baseline in src/tradingagents/reporting.py and src/tradingagents/agents/context.py.
  tradeoff: Omitting unsupported details keeps profiles factual even when the resulting introduction is brief.
  fit_criterion:
    metric: Fixture exports failing the expected section count, placement, content or completion checks
    threshold: 0
    verification: RPT-T1 through RPT-T4 in docs/code-governance/verification-constraints.md
- id: FR-TOK-01
  type: functional
  priority: Must
  statement: >
    For each CLI analysis, start the usage total at zero. After each completed model call across
    all agents, add its provider-reported input and output token counts. On the first total strictly
    greater than the threshold, display one terminal warning with the total and threshold. Continue
    the analysis through normal report generation. The threshold defaults to 100000 tokens and accepts
    a positive integer override via TRADINGAGENTS_TOKEN_WARNING_THRESHOLD in .env.
  source: Team lead, FEAT-04 approval on 2026-11-22. Existing accounting in src/cli/stats_handler.py and src/cli/run.py.
  tradeoff: The user can finish the analysis after a warning, so further model calls may consume more tokens.
  fit_criterion:
    metric: Scripted runs with incorrect warning count, timing, displayed values or report completion
    threshold: 0
    verification: TOK-T1 and TOK-T2 in docs/code-governance/verification-constraints.md
